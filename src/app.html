<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="MyBench — your personal AI benchmark. Stop reading model reviews. Build benchmarks tuned to your actual work and run them across model × harness combos." />
		<meta name="theme-color" content="#fbf9f4" />

		<!-- Open Graph -->
		<meta property="og:title" content="MyBench — your personal AI benchmark" />
		<meta property="og:description" content="Public benchmarks tell you which model is best at average tasks. MyBench tells you which model + harness to use for your tasks." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://mybench.codefiworks.com" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="MyBench" />
		<meta name="twitter:description" content="Your personal AI benchmark. Build it from an interview. Run it across model × harness." />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-paper text-ink antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
